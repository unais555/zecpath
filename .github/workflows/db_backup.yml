name: Daily PostgreSQL Backup

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 02:00 UTC (07:30 AM IST)
  workflow_dispatch:       # Allows manual trigger for immediate testing

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump Production Database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          FILENAME="zecpath_backup_$(date +%Y%m%d_%H%M%S).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-acl | gzip > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Upload Backup Artifact (Retained 14 Days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14