      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
  /candidate/resume/parse/:
    post:
      operationId: candidate_resume_parse_create
      tags:
      - Users
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumeUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /candidate/saved-jobs/:
    get:
      operationId: candidate_saved_jobs_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - candidate
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSavedJobList'
          description: ''
    post:
      operationId: candidate_saved_jobs_create
      tags:
      - candidate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedJobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedJobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedJobRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedJob'
          description: ''
  /dashboard/candidate/:
    get:
      operationId: dashboard_candidate_retrieve
      tags:
      - Users
      security:
      - jwtAuth: []
      - BearerAuth: []
