            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /interviews/{session_id}/results/:
    get:
      operationId: interviews_results_retrieve
      description: API for the Employer to retrieve the total scores for an interview.
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - AI Interviews
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /interviews/questions/{question_id}/submit-answer/:
    post:
      operationId: interviews_questions_submit_answer_create
      description: API to submit a candidate's answer and instantly generate a score.
      parameters:
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - AI Interviews
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer_text:
                  type: string
                confidence_indicator:
                  type: number
              required:
              - answer_text
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /jobs/:
    get:
      operationId: jobs_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: experience
        schema:
          type: integer
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - full_time
          - intership
          - part_time
        description: |-
          * `part_time` - Part_time
          * `full_time` - Full_time
          * `intership` - Internship
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: max_salary
        schema:
          type: number
      - in: query
        name: min_salary
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: skills
        schema:
          type: string
      tags:
      - jobs
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
  /jobs/{job_id}/analytics/:
    get:
      operationId: jobs_analytics_retrieve
      description: Provides hiring funnel metrics and conversion rates for a specific
        job.
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
