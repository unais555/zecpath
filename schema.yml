components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
          type: integer
        job_title:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        resume_snapshot:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/NewStatusEnum'
        status_display:
          type: string
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applied_at
      - company_name
      - id
      - job
      - job_title
      - status_display
    ApplicationStatusUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/NewStatusEnum'
    ApplicationStatusUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/NewStatusEnum'
        notes:
          type: string
          writeOnly: true
    ApplicationTimeline:
      type: object
      properties:
        old_status:
          $ref: '#/components/schemas/NewStatusEnum'
        new_status:
          $ref: '#/components/schemas/NewStatusEnum'
        notes:
          type: string
          description: Optional feedback from the employer.
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - new_status
      - old_status
      - timestamp
    BlankEnum:
      enum:
      - ''
    CandidateProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        skills:
          type: string
          description: Comma-separated list of skills (e.g., Python, Django, React)
        education:
          type: string
          description: Details of degrees, certifications, and institutions
        experience:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total years of professional experience
        expected_salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Expected annual salary
        resume:
          type: string
          format: uri
          nullable: true
      required:
      - id
    CandidateProfileRequest:
      type: object
      properties:
        skills:
          type: string
          description: Comma-separated list of skills (e.g., Python, Django, React)
        education:
          type: string
          description: Details of degrees, certifications, and institutions
        experience:
          type: integer
          maximum: 2147483647
