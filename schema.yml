          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationStatusUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusUpdate'
          description: ''
  /employer/jobs/:
    get:
      operationId: employer_jobs_list
      parameters:
      - name: ordering
