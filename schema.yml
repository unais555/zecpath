      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /employer/applicants/{job_id}/:
    get:
      operationId: employer_applicants_list
      parameters:
      - in: query
        name: job__id
        schema:
          type: integer
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - applied
          - interview_scheduled
          - rejected
          - selected
          - shortlisted
        description: |-
          * `applied` - Applied
          * `shortlisted` - Shortlisted
          * `interview_scheduled` - Interview Scheduled
          * `rejected` - Rejected
          * `selected` - Selected
      tags:
      - employer
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployerApplicantList'
          description: ''
  /employer/applications/{id}/status/:
    put:
      operationId: employer_applications_status_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - employer
