      operationId: jobs_apply_create
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /payments/admin/revenue/:
    get:
      operationId: payments_admin_revenue_retrieve
      description: 'Generates financial metrics: Daily/Monthly revenue and Plan-wise
        splits.'
      summary: Revenue & subscription report
